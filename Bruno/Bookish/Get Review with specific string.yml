info:
  name: Get Review with specific string
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:8080/bookish/review/search?text=book
  params:
    - name: text
      value: book
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
