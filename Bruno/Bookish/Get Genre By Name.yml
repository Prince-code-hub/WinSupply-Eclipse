info:
  name: Get Genre By Name
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/bookish/genres/search?name=fantasy
  params:
    - name: name
      value: fantasy
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
