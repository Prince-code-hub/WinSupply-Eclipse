info:
  name: Get book by Title
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:8080/bookish/book/search?title=The hunger Games
  params:
    - name: title
      value: The hunger Games
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
