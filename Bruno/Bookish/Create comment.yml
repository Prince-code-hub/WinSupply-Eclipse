info:
  name: Create comment
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/bookish/comment
  body:
    type: json
    data: |-
      {
        "reviewId" : 1,
        "commentText": "Love this book"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
